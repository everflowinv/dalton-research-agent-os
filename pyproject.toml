[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dalton-core"
version = "0.1.0.dev0"
description = "Runtime-independent control kernel prototype for Dalton Research Agent OS"
requires-python = ">=3.11"

[project.optional-dependencies]
deploy = ["cos-python-sdk-v5==1.9.44"]
# P9d-7: rendering a fetched PDF for human review.  Kept optional so the core
# stays dependency-free; without it a PDF is refused with its reason instead
# of being guessed at.  pypdf needs no runtime dependencies on Python 3.11+.
pdf = ["pypdf>=6.0,<7"]
# P13ag: the SEC statements parser. Optional and pinned to a floor, because it
# is the thing the owner agreed to trust in place of Dalton verifying the bytes
# itself: without it the lane refuses rather than guessing, and the identity's
# adapter hash names the library so a swap is a different capability.
sec-financials = ["edgartools>=5.17.1,<6"]
# P11a: the market-data library. Optional for the same reason the SEC parser
# is: it is the thing the owner agreed to trust in place of Dalton verifying
# Yahoo's bytes itself, so without it the lane refuses with a reason rather
# than guessing, and the identity's adapter hash names the library so swapping
# it is a different capability. Floored rather than pinned tight -- the source
# is unofficial and the library tracks its breakages, so being able to take a
# fix is worth more here than a narrow range.
market-data = ["yfinance>=0.2.31"]

[project.scripts]
dalton-bootstrap = "dalton_core.bootstrap:main"
dalton-health = "dalton_core.health:main"
dalton-writer = "dalton_core.writer_server:main"
daltond = "dalton_core.service:main"
dalton-gov = "dalton_core.governance_cli:main"
dalton-agenda = "dalton_core.agenda_coordinator:main"
dalton-sec-lane = "dalton_core.sec_lane_cli:main"
dalton-perception-legacy = "dalton_core.perception:main"
dalton-backup = "dalton_core.backup:main"
dalton-control = "dalton_core.agenda_control:main"
dalton-thesis-impact-calibrate = "dalton_core.thesis_impact_calibration:main"
dalton-thesis-impact-calibrate-live = "dalton_core.thesis_impact_calibration_runner:main"
dalton-thesis-impact-calibrate-matrix = "dalton_core.thesis_impact_calibration_matrix:main"
dalton-thesis-impact-verifier-canary = "dalton_core.thesis_impact_verifier_canary:main"
dalton-thesis-impact = "dalton_core.thesis_impact_production:main"
dalton-llm-planner-calibrate = "dalton_core.llm_research_planner_calibration_runner:main"
dalton-transcript-polish-calibrate = "dalton_core.transcript_polish_calibration_runner:main"
dalton-stage-transcript-review = "dalton_core.transcript_review_inbox:main"
dalton-acquire-alphaengine = "dalton_core.alphaengine_acquisition_cli:main"
dalton-connector-governance = "dalton_core.connector_governance_cli:main"
dalton-model-inputs = "dalton_core.company_model_report:main"
dalton-market-price = "dalton_core.market_price_cli:main"
dalton-model-forecast = "dalton_core.company_model_forecast_cli:main"
dalton-research-quality = "dalton_core.research_quality_cli:main"
dalton-sales-notes = "dalton_core.sales_notes_cli:main"
dalton-company-wiki = "dalton_core.company_wiki_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
# Every schema file, by pattern. This was a list of thirty-seven names, and a
# lane that added its own schema had to remember to add a thirty-eighth or
# ship a wheel whose migration file is simply missing -- a failure that shows
# up at install time on someone else's machine. "schema.sql" is named
# separately because it is the Core's own and does not carry the suffix.
dalton_core = [
  "schema.sql",
  "*_schema.sql",
  "connector_inventory/*.json",
  "connector_inventory/profiles/*.json",
  "connector_inventory/fixtures/*.json",
  "connector_inventory/proposals/*.json",
  "reference_shadow_fixtures/*.json",
  "calibration_fixtures/*.json",
  "thesis-impact-verifier-output-v0.2.schema.json",
  "thesis-impact-verifier-provider-output-v0.2.schema.json",
  "thesis-impact-verifier-decision-provider-output-v0.1.schema.json",
  "dashboard.html",
  "cockpit_control.html",
  "cockpit_control_legacy.html",
]

[tool.setuptools.data-files]
"share/dalton-core/contracts" = ["contracts/*.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]
