<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dalton Agenda 控制面</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#0d1a24;--line:#203240;--text:#edf5f7;--muted:#91a5ae;--cyan:#56d7cf;--green:#57d68d;--red:#ff7587;--amber:#f0c36b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123040 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(980px,calc(100% - 28px));margin:40px auto 80px}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}h1{font-size:28px;margin:0}header p{margin:5px 0 0;color:var(--muted)}.badge{border:1px solid var(--line);background:#0a151e;padding:7px 11px;border-radius:999px;color:var(--cyan);white-space:nowrap}
    .notice{padding:12px 14px;border:1px solid #735f2c;background:#2a2211;color:#f5d58c;border-radius:12px;margin-bottom:18px}.list{display:grid;gap:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#0f202b,#0b1720);border-radius:16px;padding:18px;box-shadow:0 16px 40px #0005}.head{display:flex;justify-content:space-between;gap:16px}.company{font-size:18px;font-weight:700}.meta{color:var(--muted);font-size:13px}.state{font-weight:700}.state.pending{color:var(--amber)}.state.agree{color:var(--green)}.state.disagree{color:var(--red)}.state.mixed{color:var(--amber)}
    ol{margin:16px 0 12px;padding-left:22px}.question{margin:10px 0}.criteria{display:block;color:var(--muted);font-size:13px;margin-top:3px}.actions{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px}.actions button{appearance:none;border:1px solid var(--line);border-radius:10px;padding:10px 16px;color:var(--text);font-weight:700;cursor:pointer;background:#132630}.actions button:hover{border-color:var(--cyan)}.actions .agree{background:#123427;border-color:#246e4b}.actions .disagree{background:#351821;border-color:#783243}.actions button:disabled{opacity:.45;cursor:wait}.result{color:var(--muted);font-size:13px;margin-left:auto}.empty,.error{padding:36px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.error{color:var(--red)}
    @media(max-width:640px){main{margin-top:24px}header,.head{align-items:flex-start;flex-direction:column}.result{width:100%;margin:2px 0 0}.actions{flex-wrap:wrap}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Dalton Agenda 控制面</h1><p>明确同意或不同意；超时默认接受单独记账，不算人工同意。</p></div><span class="badge" id="fresh">正在读取</span></header>
  <div class="notice">此页面只通过 Tailscale Serve 开放。Discord 只接收 Agenda 通知，不再承载审批。</div>
  <section class="list" id="list"><div class="empty">正在加载议程…</div></section>
</main>
<script>
  const list=document.getElementById("list"),fresh=document.getElementById("fresh");let csrf="";
  const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
  const fmt=iso=>new Intl.DateTimeFormat("zh-CN",{dateStyle:"medium",timeStyle:"short"}).format(new Date(iso));
  const stateText=x=>x.resolution==="explicit_human"?`人工：${x.effective_verdict}`:x.resolution==="auto_accept_timeout"?"超时默认接受":"等待处理";
  async function load(){
    const r=await fetch("/v1/agenda",{headers:{Accept:"application/json"},cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const data=await r.json();csrf=data.csrf_token;fresh.textContent=`截至 ${fmt(data.as_of)}`;list.replaceChildren();
    if(!data.items.length){list.append(node("div","还没有已送达的 Agenda","empty"));return}
    data.items.forEach(item=>{
      const card=node("article",null,"card"),head=node("div",null,"head"),copy=node("div"),side=node("div",stateText(item),`state ${item.effective_verdict}`);
      copy.append(node("div",item.company_ref,"company"),node("div",`送达 ${fmt(item.delivered_at)} · 截止 ${fmt(item.deadline_at)}`,"meta"));head.append(copy,side);card.append(head);
      const ol=node("ol");(item.selected||[]).forEach(q=>{const li=node("li",null,"question");li.append(node("span",q.question),node("span",`验收：${q.answer_criteria}`,"criteria"));ol.append(li)});card.append(ol);
      const actions=node("div",null,"actions"),agree=node("button","同意","agree"),disagree=node("button","不同意","disagree"),result=node("span",item.own_verdict?`你已选择：${item.own_verdict}`:"", "result");
      async function submit(verdict){agree.disabled=disagree.disabled=true;result.textContent="正在保存…";try{const r=await fetch("/v1/agenda/feedback",{method:"POST",headers:{"Content-Type":"application/json","X-Dalton-CSRF":csrf},body:JSON.stringify({decision_ref:item.decision_ref,verdict})});if(!r.ok)throw new Error(`HTTP ${r.status}`);result.textContent="已保存";await load()}catch(e){result.textContent=`保存失败：${e.message}`;agree.disabled=disagree.disabled=false}}
      agree.onclick=()=>submit("agree");disagree.onclick=()=>submit("disagree");actions.append(agree,disagree,result);card.append(actions);list.append(card);
    });
  }
  load().catch(e=>{fresh.textContent="不可用";list.replaceChildren(node("div",`读取失败：${e.message}`,"error"))});
</script>
</body>
</html>
