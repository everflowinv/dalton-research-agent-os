<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dalton Cockpit</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#0d1a24;--line:#203240;--text:#edf5f7;--muted:#91a5ae;--cyan:#56d7cf;--green:#57d68d;--red:#ff7587;--amber:#f0c36b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123040 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1120px,calc(100% - 28px));margin:34px auto 80px}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}h1{font-size:29px;margin:0}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:18px 0 8px}header p{margin:5px 0 0;color:var(--muted)}.badge{border:1px solid var(--line);background:#0a151e;padding:7px 11px;border-radius:999px;color:var(--cyan);white-space:nowrap}.notice{padding:12px 14px;border:1px solid #735f2c;background:#2a2211;color:#f5d58c;border-radius:12px;margin-bottom:18px}.tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:10px}.tab{appearance:none;border:1px solid transparent;border-radius:10px;padding:9px 14px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.tab.active{background:#132630;border-color:#2a4859;color:var(--text)}.pane[hidden]{display:none}.list{display:grid;gap:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#0f202b,#0b1720);border-radius:16px;padding:18px;box-shadow:0 16px 40px #0005}.head{display:flex;justify-content:space-between;gap:16px}.subject,.company{font-size:18px;font-weight:700}.meta,.source,.hint{color:var(--muted);font-size:13px}.state{font-weight:700}.state.pending{color:var(--amber)}.state.agree,.state.done{color:var(--green)}.state.disagree,.state.blocked{color:var(--red)}.statement{font-size:16px;margin:14px 0}.number{font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan)}.quote{white-space:pre-wrap;border-left:3px solid var(--cyan);padding:10px 12px;margin:12px 0;background:#08141d;color:#dcebed}.flags{display:grid;gap:7px;margin:10px 0}.flag{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#09151e;border-radius:9px;padding:8px 10px}.flag code{color:var(--amber)}ol{margin:14px 0 12px;padding-left:22px}.question{margin:9px 0}.criteria{display:block;color:var(--muted);font-size:13px;margin-top:3px}textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;background:#08141d;color:var(--text);padding:10px;margin:14px 0 10px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}.actions button{appearance:none;border:1px solid var(--line);border-radius:10px;padding:10px 15px;color:var(--text);font-weight:700;cursor:pointer;background:#132630}.actions button:hover{border-color:var(--cyan)}.actions .accept,.actions .agree{background:#123427;border-color:#246e4b}.actions .revise{background:#332a14;border-color:#705e29}.actions .reject,.actions .disagree{background:#351821;border-color:#783243}.actions button:disabled{opacity:.45;cursor:wait}.result{color:var(--muted);font-size:13px;margin-left:auto}.empty,.error{padding:32px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.error{color:var(--red)}.section-note{color:var(--muted);margin:-8px 0 14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv{border:1px solid var(--line);border-radius:10px;padding:10px;background:#09151e}.kv b{display:block;color:var(--cyan);font-size:13px;margin-bottom:3px}
    @media(max-width:700px){main{margin-top:22px}header,.head{align-items:flex-start;flex-direction:column}.split{grid-template-columns:1fr}.result{width:100%;margin:2px 0 0}.actions{align-items:stretch}.actions button{width:100%}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Dalton Cockpit</h1><p>一个入口查看议程与待审研究；不同写入仍由各自的 Core 权限和 gate 决定。</p></div><span class="badge" id="fresh">正在读取</span></header>
  <div class="notice">此页面只通过 Tailscale Serve 开放。Agenda 超时接受不算人工研究审阅，也不能批准 Evidence、Claim 或 production。</div>
  <nav class="tabs"><button class="tab active" data-pane="review">待审</button><button class="tab" data-pane="agenda">议程</button></nav>
  <section class="pane" id="review-pane">
    <h2>Transcript 与候选 Claim</h2>
    <p class="section-note">先核对 raw span 和未决修正，再决定是否把候选写入正式 Ledger。</p>
    <div class="list" id="transcript-list"><div class="empty">正在加载 transcript review…</div></div>
    <h2 style="margin-top:26px">候选研究结论</h2>
    <div class="list" id="research-list"><div class="empty">正在加载候选…</div></div>
  </section>
  <section class="pane" id="agenda-pane" hidden>
    <h2>Agenda</h2>
    <p class="section-note">明确同意或不同意；超时默认接受单独记账。</p>
    <div class="list" id="agenda-list"><div class="empty">正在加载议程…</div></div>
  </section>
</main>
<script>
const fresh=document.getElementById("fresh"),agendaList=document.getElementById("agenda-list"),researchList=document.getElementById("research-list"),transcriptList=document.getElementById("transcript-list");let csrf="";
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
const fmtDate=iso=>new Intl.DateTimeFormat("zh-CN",{dateStyle:"medium",timeStyle:"short"}).format(new Date(iso));
const fmt=x=>typeof x==="string"?x:JSON.stringify(x);
document.querySelectorAll(".tab").forEach(button=>button.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===button));document.querySelectorAll(".pane").forEach(x=>x.hidden=x.id!==`${button.dataset.pane}-pane`)});
async function getJson(path){const response=await fetch(path,{headers:{Accept:"application/json"},cache:"no-store"});if(!response.ok)throw new Error(`${path} HTTP ${response.status}`);const value=await response.json();if(csrf&&value.csrf_token!==csrf)throw new Error("CSRF session changed");csrf=value.csrf_token;return value}
async function postJson(path,value){const response=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Dalton-CSRF":csrf},body:JSON.stringify(value)});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}
const requestId=()=>((crypto.randomUUID&&crypto.randomUUID())||`${Date.now()}-${Math.random()}`).replace(/[^A-Za-z0-9._-]/g,"_");
function renderTranscript(data){transcriptList.replaceChildren();if(!data.enabled){transcriptList.append(node("div","Transcript review 尚未启用","empty"));return}if(!data.items.length){transcriptList.append(node("div","没有待审 transcript packet","empty"));return}data.items.forEach(item=>{const card=node("article",null,"card"),claim=item.candidate_claim,citation=claim.citation,state=item.state||{},head=node("div",null,"head"),copy=node("div"),status=node("div",state.status==="claim_eligible"?"引用已具备 Claim 资格":state.status==="correction_published"?"修正集已发布，等待引用绑定":"等待人工审阅",`state ${state.status==="claim_eligible"?"done":"pending"}`);copy.append(node("div",`${item.source.title} · Transcript review`,"subject"),node("div",`${item.source.content_chars.toLocaleString()} 字 · ${item.source.page_count} 页 · ${item.packet_ref}`,"meta"));head.append(copy,status);card.append(head,node("div",claim.normalized_statement,"statement"),node("div",`${claim.value}% · ${claim.period}`,"number"),node("div",citation.raw_span,"quote"));const authority=node("div",null,"split");const source=node("div",null,"kv"),secondary=node("div",null,"kv");source.append(node("b","Raw authority"),node("span",`${item.source.document_ref} · SHA-256 ${item.source.content_sha256.slice(0,12)}…`));secondary.append(node("b","数值二次权威"),node("span",`${claim.required_secondary_numeric_authority.source_type} · ${claim.required_secondary_numeric_authority.source_ref}`));authority.append(source,secondary);card.append(authority,node("h3","未决 ASR 标记"));const flags=node("div",null,"flags");item.proposed_correction_set.corrections.forEach(flag=>{const row=node("div",null,"flag");row.append(node("code",flag.source_text),node("span",`${flag.disposition} · ${flag.source_start}–${flag.source_end}`,"meta"));flags.append(row)});card.append(flags,node("div",`这些标记与候选引用重叠：${item.proposed_correction_set.unresolved_overlap_with_formal_citation} 条。点击确认即表示你核对了 raw span、-3% 符号和全部未决标记。`,"hint"));if(state.status!=="claim_eligible"){const actions=node("div",null,"actions"),accept=node("button","确认未决标记并绑定引用","accept"),result=node("span","","result");accept.onclick=async()=>{if(!confirm("确认 raw span、-3% 符号和全部未决标记，并生成 Claim citation binding？"))return;accept.disabled=true;result.textContent="正在写入 correction authority…";try{await postJson("/v1/transcript-review/decision",{request_id:requestId(),packet_ref:item.packet_ref,packet_hash:item.packet_hash,action:"publish_and_bind"});await load()}catch(error){result.textContent=`保存失败：${error.message}`;accept.disabled=false}};actions.append(accept,result);card.append(actions)}transcriptList.append(card)})}
const decisionText=item=>{if(!item.decision)return"等待审阅";if(item.decision.verdict==="accept")return item.commit_state==="committed"?"已接受并入库":"已接受，等待入库";return item.decision.verdict==="revise"?"已要求修订":"已拒绝"};
function renderResearch(data){researchList.replaceChildren();if(!data.enabled){researchList.append(node("div","研究候选审阅尚未启用","empty"));return}if(!data.items.length){researchList.append(node("div","没有待审候选","empty"));return}data.items.forEach(item=>{const card=node("article",null,"card"),head=node("div",null,"head"),copy=node("div"),state=node("div",decisionText(item),item.decision?"state done":"state pending");copy.append(node("div",`${item.subject_ref} · ${item.metric_or_aspect}`,"subject"),node("div",`${fmt(item.period)} · ${item.basis}`,"meta"));head.append(copy,state);const scale=item.scale==="one"?"":item.scale;card.append(head,node("div",item.normalized_statement,"statement"),node("div",`${item.value} ${scale} ${item.currency||""} ${item.unit}`.replace(/\s+/g," ").trim(),"number"),node("div",`${item.source_type} · ${item.source_ref}`,"source"));if(!item.decision){const rationale=node("textarea");rationale.placeholder="写明你核对了什么，以及接受、修订或拒绝的理由";const actions=node("div",null,"actions"),accept=node("button","接受并写入正式 Ledger","accept"),revise=node("button","要求修订","revise"),reject=node("button","拒绝","reject"),result=node("span","","result");async function submit(verdict){if(!rationale.value.trim()){result.textContent="请先写审阅理由";return}let proposed=null;if(verdict==="revise"){const revised=prompt("请输入修订后的完整陈述");if(!revised)return;proposed={normalized_statement:revised}}accept.disabled=revise.disabled=reject.disabled=true;result.textContent="正在保存…";try{await postJson("/v1/research-review/decision",{request_id:requestId(),candidate_claim_ref:item.candidate_claim_ref,candidate_claim_hash:item.candidate_claim_hash,verdict,rationale:rationale.value.trim(),findings:[],proposed_revisions:proposed});await load()}catch(error){result.textContent=`保存失败：${error.message}`;accept.disabled=revise.disabled=reject.disabled=false}}accept.onclick=()=>submit("accept");revise.onclick=()=>submit("revise");reject.onclick=()=>submit("reject");actions.append(accept,revise,reject,result);card.append(rationale,actions)}researchList.append(card)})}
const agendaState=x=>x.resolution==="explicit_human"?`人工：${x.effective_verdict}`:x.resolution==="auto_accept_timeout"?"超时默认接受":"等待处理";
function renderAgenda(data){agendaList.replaceChildren();if(!data.items.length){agendaList.append(node("div","还没有已送达的 Agenda","empty"));return}data.items.forEach(item=>{const card=node("article",null,"card"),head=node("div",null,"head"),copy=node("div"),side=node("div",agendaState(item),`state ${item.effective_verdict}`);copy.append(node("div",item.company_ref,"company"),node("div",`送达 ${fmtDate(item.delivered_at)} · 截止 ${fmtDate(item.deadline_at)}`,"meta"));head.append(copy,side);card.append(head);const ol=node("ol");(item.selected||[]).forEach(question=>{const li=node("li",null,"question");li.append(node("span",question.question),node("span",`验收：${question.answer_criteria}`,"criteria"));ol.append(li)});card.append(ol);const actions=node("div",null,"actions"),agree=node("button","同意","agree"),disagree=node("button","不同意","disagree"),result=node("span",item.own_verdict?`你已选择：${item.own_verdict}`:"","result");async function submit(verdict){agree.disabled=disagree.disabled=true;result.textContent="正在保存…";try{await postJson("/v1/agenda/feedback",{decision_ref:item.decision_ref,verdict});await load()}catch(error){result.textContent=`保存失败：${error.message}`;agree.disabled=disagree.disabled=false}}agree.onclick=()=>submit("agree");disagree.onclick=()=>submit("disagree");actions.append(agree,disagree,result);card.append(actions);agendaList.append(card)})}
async function load(){try{const [agenda,research,transcript]=await Promise.all([getJson("/v1/agenda"),getJson("/v1/research-review"),getJson("/v1/transcript-review")]);fresh.textContent=`截至 ${fmtDate(agenda.as_of)}`;renderAgenda(agenda);renderResearch(research);renderTranscript(transcript)}catch(error){fresh.textContent="不可用";[agendaList,researchList,transcriptList].forEach(list=>list.replaceChildren(node("div",`读取失败：${error.message}`,"error")))}}
load();
</script>
</body>
</html>
