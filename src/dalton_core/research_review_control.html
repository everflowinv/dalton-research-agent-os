<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dalton 研究审阅</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--panel:#0d1a24;--line:#203240;--text:#edf5f7;--muted:#91a5ae;--cyan:#56d7cf;--green:#57d68d;--red:#ff7587;--amber:#f0c36b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123040 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1040px,calc(100% - 28px));margin:40px auto 80px}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:28px;margin:0}header p{margin:5px 0 0;color:var(--muted)}.badge{border:1px solid var(--line);background:#0a151e;padding:7px 11px;border-radius:999px;color:var(--cyan)}.notice{padding:12px 14px;border:1px solid #735f2c;background:#2a2211;color:#f5d58c;border-radius:12px;margin-bottom:18px}.list{display:grid;gap:16px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#0f202b,#0b1720);border-radius:16px;padding:18px}.head{display:flex;justify-content:space-between;gap:16px}.subject{font-size:18px;font-weight:700}.meta,.source{color:var(--muted);font-size:13px}.statement{font-size:16px;margin:16px 0}.number{font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--cyan)}textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;background:#08141d;color:var(--text);padding:10px;margin:14px 0 10px;resize:vertical}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions button{appearance:none;border:1px solid var(--line);border-radius:10px;padding:10px 15px;color:var(--text);font-weight:700;cursor:pointer;background:#132630}.actions .accept{background:#123427;border-color:#246e4b}.actions .revise{background:#332a14;border-color:#705e29}.actions .reject{background:#351821;border-color:#783243}.actions button:disabled{opacity:.45;cursor:wait}.result{color:var(--muted);font-size:13px;margin-left:auto}.done{color:var(--green)}.error,.empty{padding:36px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.error{color:var(--red)}@media(max-width:640px){main{margin-top:24px}header,.head{align-items:flex-start;flex-direction:column}.result{width:100%;margin:2px 0 0}}
  </style>
</head>
<body><main>
  <header><div><h1>Dalton 研究审阅</h1><p>核对候选语义；只有明确“接受并入库”才会写入正式 Ledger。</p></div><span class="badge" id="fresh">正在读取</span></header>
  <div class="notice">数值验证通过不等于语义正确。超时、Agenda 默认接受和自动化账号都不能在这里批准入库。</div>
  <section class="list" id="list"><div class="empty">正在加载候选…</div></section>
</main><script>
const list=document.getElementById("list"),fresh=document.getElementById("fresh");let csrf="";const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};const fmt=x=>typeof x==="string"?x:JSON.stringify(x);const decisionText=item=>{if(!item.decision)return"等待审阅";if(item.decision.verdict==="accept")return item.commit_state==="committed"?"已接受并入库":"已接受，等待入库";return item.decision.verdict==="revise"?"已要求修订":"已拒绝"};async function load(){const r=await fetch("/v1/research-review",{headers:{Accept:"application/json"},cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();csrf=data.csrf_token;fresh.textContent=`候选 ${data.items.length} 条`;list.replaceChildren();if(!data.items.length){list.append(node("div","还没有待审候选","empty"));return}data.items.forEach(item=>{const card=node("article",null,"card"),head=node("div",null,"head"),copy=node("div"),state=node("div",decisionText(item),item.decision?"done":"meta");copy.append(node("div",`${item.subject_ref} · ${item.metric_or_aspect}`,"subject"),node("div",`${fmt(item.period)} · ${item.basis}`,"meta"));head.append(copy,state);const scale=item.scale==="one"?"":item.scale;card.append(head,node("div",item.normalized_statement,"statement"),node("div",`${item.value} ${scale} ${item.currency||""} ${item.unit}`.replace(/\s+/g," ").trim(),"number"),node("div",`${item.source_type} · ${item.source_ref}`,"source"));if(!item.decision){const rationale=node("textarea",null);rationale.placeholder="写明你核对了什么，以及接受、修订或拒绝的理由";const actions=node("div",null,"actions"),accept=node("button","接受并写入正式 Ledger","accept"),revise=node("button","要求修订","revise"),reject=node("button","拒绝","reject"),result=node("span","","result");async function submit(verdict){if(!rationale.value.trim()){result.textContent="请先写审阅理由";return}let proposed=null;if(verdict==="revise"){const revised=prompt("请输入修订后的完整陈述");if(!revised)return;proposed={normalized_statement:revised}}accept.disabled=revise.disabled=reject.disabled=true;result.textContent="正在保存…";try{const request_id=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`).replace(/[^A-Za-z0-9._-]/g,"_");const response=await fetch("/v1/research-review/decision",{method:"POST",headers:{"Content-Type":"application/json","X-Dalton-CSRF":csrf},body:JSON.stringify({request_id,candidate_claim_ref:item.candidate_claim_ref,candidate_claim_hash:item.candidate_claim_hash,verdict,rationale:rationale.value.trim(),findings:[],proposed_revisions:proposed})});if(!response.ok)throw new Error(`HTTP ${response.status}`);await load()}catch(error){result.textContent=`保存失败：${error.message}`;accept.disabled=revise.disabled=reject.disabled=false}}accept.onclick=()=>submit("accept");revise.onclick=()=>submit("revise");reject.onclick=()=>submit("reject");actions.append(accept,revise,reject,result);card.append(rationale,actions)}list.append(card)})}load().catch(error=>{fresh.textContent="不可用";list.replaceChildren(node("div",`读取失败：${error.message}`,"error"))});
</script></body></html>
