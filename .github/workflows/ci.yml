name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Hermetic research replay canary
        run: python scripts/run_hermetic_research_replay_canary.py
      - name: Collect fail-closed review evidence
        if: matrix.python-version == '3.13'
        run: >-
          python scripts/collect_review_evidence.py
          --manifest docs/review-evidence/gate0-review.manifest.json
          --output "${RUNNER_TEMP}/gate0-review-evidence.md"
      - name: Upload review evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: gate0-review-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/gate0-review-evidence.md
          if-no-files-found: error
          retention-days: 30
      - run: python -m build

  openclaw-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run check
        working-directory: integrations/openclaw-model-broker
