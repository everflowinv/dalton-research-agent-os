name: Hermetic subprocess diagnostics

on:
  workflow_dispatch:
    inputs:
      modules:
        description: Focused modules to diagnose
        type: choice
        options: [all-six, subprocess-only]
        default: all-six

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DALTON_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/dalton-test-diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python -m pip install -e '.[prior-models,pdf]'
      - name: Runtime versions
        run: python -c 'import sys,sqlite3,platform; print(sys.version); print(platform.platform()); print("SQLite",sqlite3.sqlite_version)'
      - name: Run focused hermetic modules
        shell: bash
        env:
          DIAGNOSTIC_MODULE_SET: ${{ inputs.modules }}
        run: |
          mkdir -p "$DALTON_TEST_DIAGNOSTICS_DIR"
          modules=(tests.test_mission_document_research_production tests.test_workspace_runtime_acceptance tests.test_mission_document_research_lane)
          if [[ "$DIAGNOSTIC_MODULE_SET" == "all-six" ]]; then
            modules+=(tests.test_deployment_model_pairs tests.test_installer_startup_wait tests.test_projection_work_order_cover)
          fi
          set -o pipefail
          python -m unittest -v "${modules[@]}" 2>&1 | tee "$DALTON_TEST_DIAGNOSTICS_DIR/unittest.log"
      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subprocess-diagnostics-py${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/dalton-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
